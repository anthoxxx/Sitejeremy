<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0d0a1a">
  <title>The Paradise — Salons</title>
  <link rel="icon" href="/favicon.png?v=3" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js"></script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="btn btn-icon mobile-only" id="toggleLeft" aria-label="Salons">☰</button>
    <a href="/chat" class="logo"><img src="/img/logo-mark.webp?v=3" alt=""><span class="word">The <span>Paradise</span></span></a>
    <div class="spacer"></div>
 <button class="btn btn-sm coins-btn hidden" id="coinsBtn" title="Mes Paradise Coins et la boutique" aria-label="Paradise Coins">💰 <span class="coins-n">0</span></button>
 <button class="btn btn-icon desk-only quest-btn" id="questBtn" title="Mes quêtes du jour et mes succès" aria-label="Quêtes">🎯<span class="notif-count hidden"></span></button>
 <button class="btn btn-icon island-btn" id="islandBtn" title="L'Île du Paradise" aria-label="L'Île du Paradise">🏝️</button>
 <button class="btn btn-icon pride-btn" id="prideBtn" title="Espace Arc-en-ciel LGBTQ+" aria-label="Espace LGBTQ+">🏳️‍🌈</button>
 <button class="btn btn-icon" id="gamesBtn" title="Mini-jeux" aria-label="Mini-jeux">🎮</button>
    <button class="btn btn-icon hidden" id="ghostBtn" title="Mode fantôme (invisible)" aria-label="Mode fantôme">👻</button>
    <a href="/admin" class="btn btn-sm btn-ghost hidden" id="adminLink" title="Administration">🛡️ <span class="lbl">Admin</span></a>
    <div class="notif-wrap">
      <button class="btn btn-icon" id="notifBtn" title="Notifications" aria-label="Notifications">🔔<span class="notif-count hidden" id="notifCount"></span></button>
      <div class="notif-panel hidden" id="notifPanel"></div>
    </div>
    <button class="btn btn-icon desk-only" id="soundBtn" title="Son des notifications" aria-label="Son">🔊</button>
    <button class="btn btn-icon desk-only" onclick="LC.toggleTheme()" title="Thème" aria-label="Thème">🌓</button>
    <button class="btn btn-icon mobile-users" id="toggleRight" style="display:none" aria-label="Connectés">👥<span class="notif-count online-badge hidden" id="onlineBadge"></span></button>
    <div class="user-menu-wrap">
      <div class="me-chip" id="meChip" title="Mon compte"></div>
      <div class="user-menu hidden" id="userMenu"></div>
    </div>
  </header>

  <aside class="sidebar left" id="left">
    <div class="side-scroll">
      <div class="hidden" id="bdaySection">
        <div class="side-title">🎂 Anniversaires du jour</div>
        <div id="bdayList"></div>
      </div>
      <div class="side-title">Salons officiels</div>
      <div id="roomList"></div>
      <div class="side-title">📌 Salons membres <button class="btn btn-sm btn-primary hidden" id="createRoomBtn" title="Créer mon salon">＋ Créer</button></div>
      <div id="userRoomList"></div>
      <div class="side-title">⏳ Temporaires <button class="btn btn-sm hidden" id="createTempBtn" title="Créer un salon temporaire">＋ Créer</button></div>
      <div id="tempRoomList"></div>
      <div class="room-legend"><span><i class="dot-perm"></i> permanent</span><span><i class="dot-temp"></i> temporaire</span></div>
      <div class="side-title">👥 Amis <span class="pill" id="friendTotal">0</span></div>
      <div id="friendList"></div>
      <div class="side-title">Messages privés <span class="pill" id="pmTotal">0</span></div>
      <div id="pmList"></div>
      <div class="side-links">
        <button type="button" id="gamesLink">🎮 Mini-jeux</button>
        <a href="/histoire" target="_blank">📖 Histoire</a>
        <a href="/reglement" target="_blank">📜 Règlement</a>
        <button type="button" id="fxBtn" title="Activer / couper les animations de fête">✨ Effets</button>
        <button type="button" class="mobile-only-inline" onclick="LC.toggleTheme()">🌓 Thème</button>
        <button type="button" class="mobile-only-inline" id="soundBtn2">🔊 Son</button>
        <button type="button" class="logout-link" onclick="askLogout()">🚪 Déconnexion</button>
      </div>
    </div>
    <div class="player" id="player"></div>
  </aside>

  <section class="main">
    <div class="room-bg" id="roomBg" aria-hidden="true"></div>
    <div class="team-bar hidden" id="teamBar" title="Voir l'équipe de modération"></div>
    <div class="room-head">
      <div class="list-item" style="padding:0;cursor:default"><div class="ico" id="headIcon">✨</div></div>
      <div style="flex:1;min-width:0">
        <h2 id="headTitle">Chargement…</h2>
        <p id="headSub"></p>
      </div>
      <button class="btn btn-sm btn-ghost hidden" id="headRadio" title="Écouter la radio du salon"></button>
      <button class="btn btn-icon" id="headTranslate" title="Traducteur : choisir ta langue" aria-label="Traducteur">🌐</button>
      <button class="btn btn-icon hidden" id="headMedia" title="Photos, vidéos et liens partagés dans ce salon" aria-label="Médias">🖼️</button>
      <button class="btn btn-sm hidden" id="headVoice" title="Chat vocal"></button>
      <button class="btn btn-icon hidden" id="headSettings" title="Gérer le salon" aria-label="Gérer le salon">⚙️</button>
      <button class="btn btn-sm hidden" id="headCall" title="Appel audio">📞 <span class="lbl">Appeler</span></button>
      <button class="btn btn-sm btn-primary hidden" id="headVideo" title="Appel vidéo">📹 <span class="lbl">Visio</span></button>
      <button class="btn btn-sm btn-ghost hidden" id="headProfile">👤 <span class="lbl">Profil</span></button>
    </div>
    <div class="video-grid hidden" id="videoGrid"></div>
    <div class="season-banner hidden" id="seasonBanner"></div>
    <div class="ghost-banner hidden" id="ghostBanner"></div>
    <div class="ghost-banner customs-banner hidden" id="customsBanner"></div>
    <div class="voice-bar hidden" id="voiceBar"></div>
    <div class="voice-mini hidden" id="voiceMini"></div>
    <div class="karaoke-bar hidden" id="karaokeBar"></div>
    <div class="karaoke-bar tv-bar hidden" id="tvBar"></div>
    <div class="wheel-bar hidden" id="wheelBar"></div>
    <div class="bt-stage hidden" id="btStage"></div>
    <div class="so-stage hidden" id="soStage"></div>
    <div class="pa-stage hidden" id="paStage"></div>
    <div class="md-stage hidden" id="mdStage"></div>
    <div class="announce hidden" id="announce"></div>
    <div class="messages" id="messages"></div>
    <div class="mute-banner hidden" id="muteBanner"></div>
    <div class="typing" id="typing"></div>
    <div class="readonly-bar hidden" id="readonlyBar">📝 Salon en lecture seule : seul le bot y annonce les nouveautés du site</div>
    <form class="composer" id="composer">
      <button type="button" class="btn btn-icon" id="emojiBtn" aria-label="Émojis">😊</button>
      <button type="button" class="btn btn-icon hidden" id="staffOnlyBtn" title="Message visible seulement par les administrateurs" aria-label="Message réservé aux administrateurs">🔒</button>
      <button type="button" class="btn btn-icon" id="attachBtn" title="Envoyer une photo" aria-label="Envoyer une photo">📎</button>
      <button type="button" class="btn btn-icon hidden" id="dictateBtn" title="Dictée vocale : parle, ça écrit" aria-label="Dictée vocale">🗣️</button>
      <div class="emoji-panel hidden" id="emojiPanel"></div>
      <textarea class="input" id="input" rows="1" maxlength="1000" placeholder="Écris ton message…" spellcheck="true" lang="fr" autocapitalize="sentences" autocorrect="on"></textarea>
      <button type="button" class="btn btn-icon rec-btn" id="recBtn" title="Envoyer un message vocal" aria-label="Message vocal">🎤</button>
      <button class="btn btn-primary send-btn" aria-label="Envoyer"><span class="lbl">Envoyer</span><span class="send-ico">➤</span></button>
      <div class="rec-bar hidden" id="recBar"></div>
    </form>
  </section>

  <aside class="sidebar right" id="right">
    <div class="side-title">Connectés <span class="pill hot" id="onlineCount">0</span></div>
    <input class="input" id="userSearch" placeholder="Rechercher un pseudo…" style="margin-bottom:10px">
    <div class="filters" id="genderFilter">
      <button data-g="all" class="active">Tous</button>
      <button data-g="h" title="Hommes">💙 H</button>
      <button data-g="f" title="Femmes">🩷 F</button>
      <button data-g="room">Ici</button>
    </div>
    <div id="userList"></div>
  </aside>
</div>
<div class="drawer-back" id="drawerBack"></div>
<div class="toasts" id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/fog.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/media.js"></script>
<script src="/js/rooms.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/call.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/mutes.js"></script>
<script src="/js/games.js"></script>
<script src="/js/share.js"></script>
<script src="/js/jukebox.js"></script>
<script src="/js/tv.js"></script>
<script src="/js/wheel.js"></script>
<script src="/js/blindtest.js"></script>
<script src="/js/sommet.js"></script>
<script src="/js/paroles.js"></script>
<script src="/js/motdor.js"></script>
<script src="/js/look.js"></script>
<script src="/js/island.js"></script>
<script src="/js/babyfoot.js"></script>
<script src="/js/shop.js"></script>
<script src="/js/events.js"></script>
<script src="/js/progress.js"></script>
<script src="/js/pets.js"></script>
<script src="/js/fortune.js"></script>
<script src="/js/translate.js"></script>
<script src="/js/capture.js"></script>
<script src="/js/team.js"></script>
</body>
</html>
