<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GajoxGaming — Salons</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js"></script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="btn btn-icon mobile-only" id="toggleLeft" aria-label="Salons">☰</button>
    <a href="/chat" class="logo"><img src="/img/logo-mark.svg" alt=""><span class="word">Gajox<span>Gaming</span></span></a>
    <div class="spacer"></div>
    <a href="/admin" class="btn btn-sm btn-ghost hidden" id="adminLink">🛡️ Admin</a>
    <button class="btn btn-icon" id="soundBtn" title="Son des notifications" aria-label="Son">🔔</button>
    <button class="btn btn-icon" onclick="LC.toggleTheme()" title="Thème" aria-label="Thème">🌓</button>
    <button class="btn btn-icon mobile-users" id="toggleRight" style="display:none" aria-label="Connectés">👥</button>
    <div class="me-chip" id="meChip"></div>
  </header>

  <aside class="sidebar left" id="left">
    <div class="side-scroll">
      <div class="side-title">Salons officiels</div>
      <div id="roomList"></div>
      <div class="side-title">Salons des membres <button class="btn btn-sm btn-primary hidden" id="createRoomBtn" title="Créer mon salon">＋ Créer</button></div>
      <div id="userRoomList"></div>
      <div class="side-title">Messages privés <span class="pill" id="pmTotal">0</span></div>
      <div id="pmList"></div>
    </div>
    <div class="player" id="player"></div>
  </aside>

  <section class="main">
    <div class="room-head">
      <div class="list-item" style="padding:0;cursor:default"><div class="ico" id="headIcon">✨</div></div>
      <div style="flex:1;min-width:0">
        <h2 id="headTitle">Chargement…</h2>
        <p id="headSub"></p>
      </div>
      <button class="btn btn-sm btn-ghost hidden" id="headRadio" title="Écouter la radio du salon"></button>
      <button class="btn btn-sm hidden" id="headVoice" title="Chat vocal"></button>
      <button class="btn btn-icon hidden" id="headSettings" title="Gérer le salon" aria-label="Gérer le salon">⚙️</button>
      <button class="btn btn-sm btn-ghost hidden" id="headProfile">Voir le profil</button>
    </div>
    <div class="voice-bar hidden" id="voiceBar"></div>
    <div class="announce hidden" id="announce"></div>
    <div class="messages" id="messages"></div>
    <div class="typing" id="typing"></div>
    <form class="composer" id="composer">
      <button type="button" class="btn btn-icon" id="emojiBtn" aria-label="Émojis">😊</button>
      <div class="emoji-panel hidden" id="emojiPanel"></div>
      <textarea class="input" id="input" rows="1" maxlength="1000" placeholder="Écris ton message…"></textarea>
      <button class="btn btn-primary" aria-label="Envoyer">Envoyer</button>
    </form>
  </section>

  <aside class="sidebar right" id="right">
    <div class="side-title">Connectés <span class="pill hot" id="onlineCount">0</span></div>
    <input class="input" id="userSearch" placeholder="Rechercher un pseudo…" style="margin-bottom:10px">
    <div class="filters" id="genderFilter">
      <button data-g="all" class="active">Tous</button>
      <button data-g="f">♀</button>
      <button data-g="h">♂</button>
      <button data-g="room">Ici</button>
    </div>
    <div id="userList"></div>
  </aside>
</div>
<div class="drawer-back" id="drawerBack"></div>
<div class="toasts" id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/media.js"></script>
<script src="/js/rooms.js"></script>
</body>
</html>
