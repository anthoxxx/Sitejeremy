<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthony ❤️ Charline</title>
<link rel="icon" href="/favicon.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07091a; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1000px; height: 600px;
    transform-origin: center; overflow: hidden; border-radius: 18px; background: #0b0f26;
    box-shadow: 0 20px 80px rgba(0,0,0,.6); }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease; pointer-events: none; }
  .scene.on { opacity: 1; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Sous-titres */
  #caption { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 860px;
    padding: 9px 22px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 19px;
    text-align: center; opacity: 0; transition: opacity .6s; z-index: 50; backdrop-filter: blur(4px); white-space: nowrap; }
  #caption.on { opacity: 1; }

  /* Écran titre / fin */
  .overlay { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; color: #fff; text-align: center;
    background: radial-gradient(circle at 50% 40%, #3a1f4d 0%, #120a24 60%, #07091a 100%); transition: opacity 1s; }
  .overlay.hide { opacity: 0; pointer-events: none; }
  .overlay h1 { margin: 0; font-size: 62px; letter-spacing: 1px; font-weight: 800; }
  .overlay h1 .a { color: #8fd3ff; } .overlay h1 .c { color: #ff8fc8; }
  .overlay p { margin: 0; font-size: 20px; opacity: .85; }
  .btn { margin-top: 10px; font-size: 22px; font-weight: 700; padding: 14px 34px; border-radius: 999px; border: 0;
    cursor: pointer; color: #3b0b25; background: linear-gradient(90deg, #ffd1e8, #ff7eb9);
    box-shadow: 0 8px 30px rgba(255,126,185,.45); transition: transform .15s; }
  .btn:hover { transform: scale(1.06); }
  .heart-beat { display: inline-block; animation: beat 1.2s infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }

  /* Bouton son */
  #mute { position: absolute; right: 14px; top: 12px; z-index: 70; border: 0; border-radius: 999px; width: 42px; height: 42px;
    font-size: 20px; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }

  /* ---- Animations SVG ---- */
  .z { font: bold 26px sans-serif; fill: #cfe0ff; opacity: 0; animation: zfloat 3.6s infinite; }
  .z2 { animation-delay: 1.2s; font-size: 20px; } .z3 { animation-delay: 2.4s; font-size: 32px; }
  @keyframes zfloat { 0% { opacity: 0; transform: translate(0,0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(40px,-80px); } }
  .breathe { transform-box: view-box; animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.05); } }
  .twinkle { animation: twinkle 2.5s infinite alternate; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
  .ringing { animation: shake .11s linear infinite; }
  @keyframes shake { 0% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } 100% { transform: rotate(-9deg); } }
  #a-clock { transform-origin: 290px 355px; }
  .ringtext { opacity: 0; transition: opacity .2s; }
  .ringtext.on { opacity: 1; animation: pulse .4s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  #a-ringtext { transform-origin: 290px 280px; }
  .fade { transition: opacity .7s; }
  #a-arm { transform-origin: 452px 285px; transform: rotate(-70deg); transition: transform .9s ease-in-out; }
  .draw { stroke-dasharray: 900; stroke-dashoffset: 900; }
  .draw.go { transition: stroke-dashoffset 3s ease-in-out; stroke-dashoffset: 0; }
  .glowpulse { animation: glowpulse 1.6s ease-in-out infinite; }
  @keyframes glowpulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }

  /* ---- Téléphone ---- */
  #phone { position: absolute; left: 357px; top: 14px; width: 286px; height: 540px; border-radius: 44px;
    background: #0d0d10; padding: 11px; box-shadow: 0 0 0 2px #3a3a44, 0 25px 60px rgba(0,0,0,.7);
    transform: scale(.15) translate(-1500px, 1200px); opacity: 0; transition: transform 1.2s cubic-bezier(.2,.8,.2,1), opacity .6s; }
  #phone.up { transform: none; opacity: 1; }
  #screen { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #000; }
  #notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 84px; height: 22px; border-radius: 20px; background: #000; z-index: 40; }
  .scr { position: absolute; inset: 0; transition: transform .7s cubic-bezier(.3,.8,.3,1), opacity .5s; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 38px; display: flex; justify-content: space-between;
    align-items: center; padding: 6px 22px 0; font-size: 13px; font-weight: 600; color: #fff; z-index: 30; }
  .statusbar.dark { color: #111; }

  #lock { background: url("/img/fond-ecran-anthony.jpg") center 30% / cover; color: #fff; text-align: center; }
  #lock::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,0) 40%, rgba(0,0,0,.45)); }
  #lock .lk { position: relative; }
  #lock .date { margin-top: 56px; font-size: 15px; font-weight: 500; text-shadow: 0 1px 6px rgba(0,0,0,.5); text-transform: capitalize; }
  #lock .time { font-size: 72px; font-weight: 300; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,.5); letter-spacing: -1px; }
  #lock .swipe { position: absolute; bottom: 18px; left: 0; right: 0; font-size: 12px; opacity: .9; }
  #lock .bar { width: 110px; height: 5px; border-radius: 4px; background: #fff; margin: 8px auto 0; }
  #lock.away { transform: translateY(-105%); }

  #home { background: #000; }
  #home::before { content: ""; position: absolute; inset: -20px; background: url("/img/fond-ecran-anthony.jpg") center 30% / cover;
    filter: blur(10px) brightness(.65); }
  .grid { position: absolute; top: 58px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 6px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .ico { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 27px;
    box-shadow: 0 3px 8px rgba(0,0,0,.3); transition: transform .15s; }
  .ico.press { transform: scale(.85); }
  .dock { position: absolute; bottom: 12px; left: 12px; right: 12px; height: 74px; border-radius: 26px; background: rgba(255,255,255,.22);
    display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(8px); }

  #snap { background: #fff; transform: scale(.2); opacity: 0; }
  #snap.open { transform: none; opacity: 1; }
  .snaphead { padding: 40px 14px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; }
  .snaphead .title { font-size: 19px; font-weight: 800; color: #111; }
  .roundbtn { width: 34px; height: 34px; border-radius: 50%; background: #f1f1f4; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .row { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-bottom: 1px solid #f2f2f2; transition: background .2s; }
  .row.press { background: #ececf2; }
  .av { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
  .nm { font-weight: 700; font-size: 15px; color: #111; }
  .sub { font-size: 12px; color: #888; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .sq { width: 10px; height: 10px; border-radius: 2px; border: 2px solid #3cb2e2; display: inline-block; }
  .sq.red { border-color: #f23c57; } .sq.purple { border-color: #9b55a0; }
  .snapnav { position: absolute; bottom: 0; left: 0; right: 0; height: 52px; border-top: 1px solid #eee; background: #fff;
    display: flex; justify-content: space-around; align-items: center; font-size: 20px; color: #999; }

  #chat { background: #fff; transform: translateX(105%); display: flex; flex-direction: column; }
  #chat.open { transform: none; }
  .chathead { padding: 38px 10px 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; }
  .chathead .back { font-size: 26px; color: #444; padding: 0 4px; line-height: 1; }
  .chatbody { flex: 1; padding: 10px 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .today { text-align: center; font-size: 11px; color: #aaa; font-weight: 700; letter-spacing: .5px; margin-bottom: auto; padding-top: 4px; }
  .msg { opacity: 0; transform: translateY(14px); transition: all .5s; }
  .msg.on { opacity: 1; transform: none; }
  .who { color: #f23c57; font-size: 11px; font-weight: 800; letter-spacing: .6px; margin-bottom: 3px; }
  .bubble { border-left: 2px solid #f23c57; padding-left: 8px; font-size: 13.5px; line-height: 1.4; color: #111; }
  .sent { font-size: 11px; color: #f23c57; margin-top: 6px; font-weight: 700; opacity: 0; transition: opacity .5s; }
  .sent.on { opacity: 1; }
  .inputbar { padding: 8px 10px 14px; display: flex; align-items: flex-end; gap: 7px; border-top: 1px solid #f2f2f2; }
  .cam { width: 34px; height: 34px; border-radius: 50%; background: #f1f1f4; display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .field { flex: 1; min-height: 34px; border-radius: 18px; background: #f1f1f4; padding: 8px 12px; font-size: 13px; line-height: 1.35; color: #111; }
  .field .ph { color: #999; }
  .caret { display: inline-block; width: 1.5px; height: 14px; background: #3cb2e2; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sendbtn { width: 34px; height: 34px; border-radius: 50%; background: #3cb2e2; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex: none; transform: scale(0); transition: transform .3s; }
  .sendbtn.on { transform: scale(1); }
  .sendbtn.press { transform: scale(.8); }

  #finger { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; z-index: 45;
    background: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.95); box-shadow: 0 0 12px rgba(0,0,0,.35);
    opacity: 0; transition: left .7s ease-in-out, top .7s ease-in-out, opacity .3s, transform .15s; left: 140px; top: 600px; }
  #finger.on { opacity: 1; }
  #finger.tap { transform: scale(.7); }

  /* Notification chez Charline */
  #notif { position: absolute; left: 270px; top: 120px; width: 330px; padding: 12px 14px; border-radius: 18px; z-index: 20;
    background: rgba(250,250,255,.95); box-shadow: 0 10px 40px rgba(0,0,0,.5); display: flex; gap: 11px; align-items: center;
    opacity: 0; transform: translateY(-20px) scale(.9); transition: all .7s cubic-bezier(.2,.9,.3,1.3); }
  #notif.on { opacity: 1; transform: none; }
  #notif .ic { width: 42px; height: 42px; border-radius: 11px; background: #fffc00; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
  #notif .t1 { font-size: 12px; color: #777; display: flex; justify-content: space-between; }
  #notif .t2 { font-weight: 800; font-size: 15px; color: #111; }
  #notif .t3 { font-size: 13px; color: #333; }

  .flyheart { position: absolute; font-size: 28px; z-index: 25; animation: fly 4s ease-out forwards; pointer-events: none; }
  @keyframes fly { 0% { opacity: 0; transform: translateY(0) scale(.5); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-330px) scale(1.3) rotate(15deg); } }
</style>
</head>
<body>
<div id="stage"></div>

<template id="tpl">
  <!-- ========== SCÈNE 1 : la carte, 7 km ========== -->
  <div class="scene" id="s-map">
    <svg viewBox="0 0 1000 600">
      <defs>
        <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0f2e"/><stop offset="1" stop-color="#29235c"/></linearGradient>
        <radialGradient id="winGlow"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ffb84d"/></radialGradient>
      </defs>
      <rect width="1000" height="600" fill="url(#skyN)"/>
      <g fill="#fff">
        <circle class="twinkle" cx="80" cy="60" r="2"/><circle class="twinkle" cx="220" cy="120" r="1.6" style="animation-delay:.5s"/>
        <circle class="twinkle" cx="340" cy="50" r="2.2" style="animation-delay:1s"/><circle class="twinkle" cx="460" cy="140" r="1.5"/>
        <circle class="twinkle" cx="600" cy="70" r="2" style="animation-delay:.8s"/><circle class="twinkle" cx="900" cy="110" r="1.8" style="animation-delay:1.4s"/>
        <circle class="twinkle" cx="700" cy="170" r="1.4" style="animation-delay:.3s"/><circle class="twinkle" cx="130" cy="200" r="1.5" style="animation-delay:1.7s"/>
      </g>
      <circle cx="840" cy="90" r="42" fill="#f6f1d3"/><circle cx="822" cy="78" r="42" fill="url(#skyN)"/>
      <path d="M0 470 Q250 400 500 450 T1000 440 L1000 600 L0 600 Z" fill="#1d2a3f"/>
      <path d="M0 520 Q300 470 600 515 T1000 500 L1000 600 L0 600 Z" fill="#162133"/>
      <!-- route -->
      <path id="road" class="draw" d="M200 440 C 360 560, 520 360, 800 440" fill="none" stroke="#ffd6ea" stroke-width="5" stroke-linecap="round"/>
      <!-- maison Charline -->
      <g transform="translate(140 330)">
        <rect x="0" y="40" width="120" height="90" fill="#c96b8f"/><path d="M-12 44 L60 -10 L132 44 Z" fill="#7e3352"/>
        <rect x="20" y="62" width="30" height="28" fill="#38304f"/><rect x="72" y="80" width="28" height="50" fill="#4b2a3a"/>
        <text x="60" y="-26" text-anchor="middle" font-size="24" font-weight="800" fill="#ffb3d4">Charline 💤</text>
      </g>
      <!-- maison Anthony -->
      <g transform="translate(740 330)">
        <rect x="0" y="40" width="120" height="90" fill="#4f7fc4"/><path d="M-12 44 L60 -10 L132 44 Z" fill="#26467a"/>
        <rect id="aWin" x="70" y="62" width="30" height="28" fill="#38304f" style="transition: fill .6s"/><rect x="20" y="80" width="28" height="50" fill="#22324d"/>
        <text x="60" y="-26" text-anchor="middle" font-size="24" font-weight="800" fill="#a9d4ff">Anthony</text>
      </g>
      <g id="km" opacity="0" style="transition: opacity .6s">
        <rect x="430" y="380" width="140" height="48" rx="24" fill="rgba(255,255,255,.95)"/>
        <text id="kmTxt" x="500" y="413" text-anchor="middle" font-size="26" font-weight="800" fill="#c2185b">0 km</text>
      </g>
    </svg>
  </div>

  <!-- ========== SCÈNE 2 : chambre de Charline ========== -->
  <div class="scene" id="s-charline">
    <svg viewBox="0 0 1000 600">
      <defs>
        <linearGradient id="wallC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f45"/><stop offset="1" stop-color="#2c2550"/></linearGradient>
        <linearGradient id="nightWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060a24"/><stop offset="1" stop-color="#1f2a6b"/></linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <radialGradient id="phoneLight"><stop offset="0" stop-color="#9fd0ff" stop-opacity=".8"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/></radialGradient>
        <pattern id="hearts" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#e979a8"/><text x="10" y="26" font-size="14" fill="#f7b4d0">♥</text></pattern>
      </defs>
      <rect width="1000" height="600" fill="url(#wallC)"/>
      <rect y="470" width="1000" height="130" fill="#241c3a"/>
      <!-- fenêtre -->
      <rect x="80" y="80" width="210" height="170" rx="6" fill="url(#nightWin)" stroke="#5b4a7a" stroke-width="10"/>
      <line x1="185" y1="80" x2="185" y2="250" stroke="#5b4a7a" stroke-width="6"/><line x1="80" y1="165" x2="290" y2="165" stroke="#5b4a7a" stroke-width="6"/>
      <circle cx="245" cy="118" r="18" fill="#f6f1d3"/><circle cx="237" cy="112" r="18" fill="#060a24"/>
      <circle class="twinkle" cx="115" cy="110" r="2" fill="#fff"/><circle class="twinkle" cx="150" cy="200" r="1.6" fill="#fff" style="animation-delay:1s"/>
      <circle class="twinkle" cx="230" cy="215" r="2" fill="#fff" style="animation-delay:.5s"/>
      <!-- tableau cœur -->
      <rect x="400" y="110" width="110" height="80" rx="4" fill="#3b2f5e" stroke="#a88bd6" stroke-width="5"/>
      <text x="455" y="164" text-anchor="middle" font-size="40" fill="#ff8fc8">♥</text>
      <!-- lit -->
      <rect x="165" y="345" width="24" height="125" rx="8" fill="#7a5443"/>
      <rect x="180" y="400" width="440" height="42" fill="#6b4a3a"/>
      <rect x="190" y="440" width="14" height="30" fill="#5a3d30"/><rect x="590" y="440" width="14" height="30" fill="#5a3d30"/>
      <rect x="185" y="370" width="425" height="38" rx="10" fill="#e8e6f5"/>
      <rect x="605" y="280" width="30" height="190" rx="10" fill="#7a5443"/>
      <ellipse cx="560" cy="360" rx="50" ry="18" fill="#fbfaff"/>
      <!-- Charline -->
      <g id="charline">
        <path d="M520 330 Q545 300 585 318 Q612 335 608 365 Q590 382 560 372 Q528 368 520 330 Z" fill="#5a3220"/>
        <path d="M585 345 Q615 360 612 384 Q595 380 586 366 Z" fill="#5a3220"/>
        <circle cx="548" cy="340" r="29" fill="#f2c4a2"/>
        <path d="M520 334 Q526 306 552 309 Q575 312 578 335 Q560 318 540 324 Q528 328 520 334 Z" fill="#5a3220"/>
        <path d="M530 344 q6 6 12 0" stroke="#3a2416" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M553 344 q6 6 12 0" stroke="#3a2416" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="530" cy="354" r="5" fill="#f08aa6" opacity=".55"/><circle cx="568" cy="354" r="5" fill="#f08aa6" opacity=".55"/>
        <path d="M542 359 q6 4 12 0" stroke="#b5566e" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <path class="breathe" style="transform-origin:360px 408px" d="M190 408 L190 372 Q250 338 340 350 Q430 330 520 358 Q528 380 525 408 Z" fill="url(#hearts)"/>
      <path d="M190 372 Q250 338 340 350 Q430 330 520 358" fill="none" stroke="#f7b4d0" stroke-width="5" stroke-linecap="round"/>
      <!-- téléphone sur le lit -->
      <ellipse id="c-phoneglow" class="glowpulse" cx="472" cy="345" rx="60" ry="30" fill="url(#phoneLight)"/>
      <g transform="translate(440 330) rotate(-8)">
        <rect width="66" height="34" rx="7" fill="#15151c" stroke="#555" stroke-width="1.5"/>
        <rect id="c-phonescr" x="4" y="4" width="58" height="26" rx="4" fill="#3d5fa8"/>
        <text x="33" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">06:30</text>
      </g>
      <!-- table de nuit + réveil -->
      <rect x="650" y="380" width="120" height="90" rx="4" fill="#5c4033"/>
      <rect x="662" y="402" width="96" height="26" rx="3" fill="#6d4d3e"/><circle cx="710" cy="415" r="4" fill="#caa36d"/>
      <rect x="665" y="328" width="90" height="52" rx="12" fill="#121218" stroke="#333" stroke-width="2"/>
      <text x="710" y="364" text-anchor="middle" font-size="27" font-weight="800" font-family="monospace" fill="#ff4545" filter="url(#glow)">06:30</text>
      <!-- Zzz -->
      <text class="z" x="520" y="300">z</text><text class="z z2" x="530" y="300">z</text><text class="z z3" x="510" y="300">Z</text>
      <!-- loupe téléphone -->
      <g id="c-zoom" class="fade" opacity="0">
        <line x1="455" y1="325" x2="410" y2="245" stroke="#cfe0ff" stroke-width="2" stroke-dasharray="5 5"/>
        <circle cx="380" cy="200" r="62" fill="#0e1330" stroke="#cfe0ff" stroke-width="3"/>
        <rect x="350" y="152" width="60" height="96" rx="10" fill="#15151c"/><rect x="354" y="157" width="52" height="86" rx="7" fill="#3d5fa8"/>
        <text x="380" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">06:30</text>
        <text x="380" y="216" text-anchor="middle" font-size="8" fill="#dde">Bonne nuit 💤</text>
      </g>
    </svg>
    <div id="notif">
      <div class="ic">👻</div>
      <div style="flex:1">
        <div class="t1"><span>SNAPCHAT</span><span>maintenant</span></div>
        <div class="t2">Anthony 💛</div>
        <div class="t3">Nouveau chat de Anthony ❤️</div>
      </div>
    </div>
  </div>

  <!-- ========== SCÈNE 3 : chambre d'Anthony ========== -->
  <div class="scene" id="s-anthony">
    <svg viewBox="0 0 1000 600">
      <defs>
        <linearGradient id="wallA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26355e"/><stop offset="1" stop-color="#34406b"/></linearGradient>
        <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a7a"/><stop offset=".6" stop-color="#e6788a"/><stop offset="1" stop-color="#ffc07a"/></linearGradient>

      <rect x="395" y="440" width="14" height="30" fill="#33405a"/><rect x="815" y="440" width="14" height="30" fill="#33405a"/>

      <g id="a-ringtext" class="ringtext">
        <text x="290" y="290" text-anchor="middle" font-size="30" font-weight="900" fill="#ffd34d" stroke="#7a3b00" stroke-width="1">DRIIIING !</text>
        <path d="M240 320 l-18 -8 M240 335 l-22 0 M340 320 l18 -8 M340 335 l22 0" stroke="#ffd34d" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g id="a-bubble" class="fade" opacity="0">
        <rect x="540" y="120" width="250" height="70" rx="22" fill="#fff"/><path d="M560 185 L540 215 L590 188 Z" fill="#fff"/>
        <text x="665" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#333">Pas dormi de la nuit… 😴</text>
        <text x="665" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#c2185b">Mais d'abord : ma chachou ❤️</text>
      </g>
    </svg>
  </div>

  <!-- ========== SCÈNE 4 : le téléphone d'Anthony ========== -->
  <div class="scene" id="s-phone" style="background: radial-gradient(circle at 50% 45%, #2b3a6b, #0b0f26 70%);">
    <div id="phone">
      <div id="screen">
        <div id="notch"></div>
        <div class="scr" id="home">
          <div class="statusbar"><span>06:30</span><span>📶 🔋</span></div>
          <div class="grid">
            <div class="app"><div class="ico" style="background:#34c759">📞</div>Téléphone</div>
            <div class="app"><div class="ico" style="background:#30d158">💬</div>Messages</div>
            <div class="app"><div class="ico" style="background:#fff">📷</div>Caméra</div>
            <div class="app"><div class="ico" style="background:#fff">🖼️</div>Photos</div>
            <div class="app"><div class="ico" style="background:#ff2d55">🎵</div>Musique</div>
            <div class="app"><div class="ico" id="snapIco" style="background:#fffc00">👻</div>Snapchat</div>
            <div class="app"><div class="ico" style="background:#0a84ff">🌤️</div>Météo</div>
            <div class="app"><div class="ico" style="background:#8e8e93">⚙️</div>Réglages</div>
            <div class="app"><div class="ico" style="background:#ff9f0a">⏰</div>Horloge</div>
            <div class="app"><div class="ico" style="background:#5e5ce6">🎮</div>Jeux</div>
            <div class="app"><div class="ico" style="background:#fff">🗺️</div>Plans</div>

          <div class="row"><div class="av" style="background:#e8ffe3">🧑🏻</div><div><div class="nm">Lucas</div><div class="sub"><span class="sq purple"></span>Ouvert · 2 j</div></div></div>
          <div class="row"><div class="av" style="background:#fff3d6">👱🏻‍♀️</div><div><div class="nm">Sarah</div><div class="sub"><span class="sq"></span>Appuie pour discuter · 3 j</div></div></div>
          <div class="row"><div class="av" style="background:#f0e3ff">🧔🏾</div><div><div class="nm">Kenzo</div><div class="sub"><span class="sq red"></span>Reçu · 4 j</div></div></div>
          <div class="snapnav"><span>📍</span><span style="color:#3cb2e2">💬</span><span>📷</span><span>👥</span><span>▶️</span></div>

          <div class="statusbar dark"><span>06:31</span><span>📶 🔋</span></div>
          <div class="chathead"><span class="back">‹</span><div class="av" style="background:#ffd6ea;width:34px;height:34px;font-size:19px">👩🏻</div>
            <div class="nm">chachou❤️</div></div>
          <div class="chatbody">
            <div class="today">AUJOURD'HUI</div>
            <div class="msg" id="msg"><div class="who">MOI</div><div class="bubble" id="msgText"></div><div class="sent" id="sent">➤ Envoyé · 06:31</div></div>
          </div>
          <div class="inputbar">
            <div class="cam">📷</div>
            <div class="field" id="field"><span class="ph">Envoyer un chat</span></div>
            <div class="sendbtn" id="sendBtn">➤</div>
          </div>
        </div>
        <div class="scr" id="lock">
          <div class="statusbar"><span></span><span>📶 🔋</span></div>
          <div class="lk"><div class="date" id="lockDate"></div><div class="time">06:30</div></div>
          <div class="swipe">Glisser vers le haut pour déverrouiller<div class="bar"></div></div>
        </div>

  <div id="caption"></div>

  <div class="overlay" id="start">
    <h1><span class="a">Anthony</span> <span class="heart-beat">❤️</span> <span class="c">Charline</span></h1>
    <p>Un petit matin à 7 km l'un de l'autre…</p>
    <button class="btn" id="go">▶ Lancer l'animation</button>
    <p style="font-size:14px;opacity:.6">🔊 Mets le son !</p>
  </div>
  <div class="overlay hide" id="end">
    <h1><span class="a">Anthony</span> <span class="heart-beat">❤️</span> <span class="c">Charline</span></h1>
    <p>Bonne journée ma chachou d'amour 😘</p>
    <button class="btn" id="again">↺ Revoir</button>
  </div>
  <button id="mute" title="Son">🔊</button>
</template>

<script>
(() => {
  const stage = document.getElementById('stage');
  const MESSAGE = "Coucou ma chachou, je viens de me réveiller, j'ai pas dormi de la nuit mais ça va le faire ! J'espère que tu vas passer une très très bonne journée ma chachou d'amour. Je veux te prendre dans mes bras 😘😘❤️❤️😘❤️❤️❤️";

  // Le décor fait 1000×600 : on l'agrandit / réduit pour remplir l'écran
  function fit() {
    const s = Math.min(innerWidth / 1000, innerHeight / 600) * 0.98;
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // ---- Sons (Web Audio, rien à télécharger) ----
  let ctx = null, muted = false;
  function tone(freq, start, dur, type = 'sine', vol = 0.15) {
    if (!ctx || muted) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    const t = ctx.currentTime + start;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    tap: () => tone(1200, 0, 0.05, 'sine', 0.08),
    pop: () => { tone(600, 0, 0.12, 'sine', 0.15); tone(900, 0.06, 0.15, 'sine', 0.12); },
    key: () => tone(1800 + Math.random() * 300, 0, 0.025, 'square', 0.02),
    chime: () => { tone(880, 0, 0.35, 'sine', 0.15); tone(1320, 0.15, 0.5, 'sine', 0.13); },
    unlock: () => { tone(500, 0, 0.1, 'triangle', 0.1); tone(750, 0.08, 0.15, 'triangle', 0.1); },
  };
  let alarmTimer = null;
  function alarmOn() {
    const ring = () => { for (let i = 0; i < 4; i++) tone(1046, i * 0.13, 0.09, 'square', 0.07); };
    ring(); alarmTimer = setInterval(ring, 900);
  }
  function alarmOff() { clearInterval(alarmTimer); alarmTimer = null; }

  const wait = ms => new Promise(r => setTimeout(r, ms));

  function build() {
    stage.innerHTML = document.getElementById('tpl').innerHTML;
    const $ = s => stage.querySelector(s);
    $('#lockDate').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    $('#mute').textContent = muted ? '🔇' : '🔊';
    $('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; };
    $('#go').onclick = () => {
      if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      $('#start').classList.add('hide');
      play($);
    };
  }

  async function play($) {
    const cap = $('#caption');
    const say = async (txt, ms) => { cap.classList.remove('on'); await wait(350); cap.textContent = txt; cap.classList.add('on'); if (ms) await wait(ms); };
    const show = id => { stage.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', s.id === id)); };

    // ---- 1. La carte : 7 km ----
    show('s-map');
    await wait(600);
    await say('Charline et Anthony vivent à 7 km l\'un de l\'autre…', 400);
    $('#road').classList.add('go');
    $('#km').setAttribute('opacity', 1);
    for (let k = 0; k <= 70; k++) { $('#kmTxt').textContent = (k / 10).toFixed(1).replace('.', ',').replace(',0', '') + ' km'; await wait(38); }
    await wait(900);
    await say('Il est 6h30 du matin… 🌙', 2200);

    // ---- 2. Charline dort ----
    show('s-charline');
    await say('Chez Charline, tout est calme… elle fait dodo 💤', 2400);
    $('#c-zoom').setAttribute('opacity', 1);
    await say('Son réveil et son téléphone affichent 6h30… mais elle dort encore 😴', 3600);
    $('#c-zoom').setAttribute('opacity', 0);

    // ---- 3. Anthony se réveille ----
    show('s-anthony');
    await say('À 7 km de là, chez Anthony…', 1700);
    $('#a-clock').classList.add('ringing'); $('#a-ringtext').classList.add('on'); alarmOn();
    await say('⏰ 6h30 : DRIIIING !', 2200);
    $('#a-lying').setAttribute('opacity', 0); $('#a-sit').setAttribute('opacity', 1);
    await say('Anthony vient de se réveiller…', 1300);
    $('#a-arm').style.transform = 'rotate(-23deg)';
    await wait(950);
    alarmOff(); sfx.tap(); $('#a-clock').classList.remove('ringing'); $('#a-ringtext').classList.remove('on');
    await say('…il éteint le réveil 🤚', 900);
    $('#a-yawn').setAttribute('opacity', 0); $('#a-smile').setAttribute('opacity', 1);
    $('#a-eyes-tired').setAttribute('opacity', 0); $('#a-eyes-open').setAttribute('opacity', 1);
    $('#a-bubble').setAttribute('opacity', 1);
    await wait(2200);
    $('#a-arm').style.transform = 'rotate(-36deg)';
    await say('…et attrape son téléphone 📱', 1000);
    $('#a-phone').setAttribute('opacity', 0); $('#a-handphone').setAttribute('opacity', 1);
    $('#a-arm').style.transform = 'rotate(20deg)';
    await wait(1300);

    // ---- 4. Le téléphone ----
    show('s-phone');
    await wait(200);
    $('#phone').classList.add('up');
    await say('Son fond d\'écran… 🥰', 2600);
    const finger = $('#finger');
    const move = async (x, y, ms = 750) => { finger.style.left = x + 'px'; finger.style.top = y + 'px'; await wait(ms); };
    const tap = async () => { finger.classList.add('tap'); sfx.tap(); await wait(160); finger.classList.remove('tap'); await wait(120); };

    // déverrouiller
    finger.style.transition = 'none'; finger.style.left = '132px'; finger.style.top = '505px';
    await wait(30); finger.style.transition = '';
    finger.classList.add('on'); await wait(400);
    await move(132, 300, 600); $('#lock').classList.add('away'); sfx.unlock();
    finger.classList.remove('on'); await wait(800);

    // ouvrir Snapchat
    await say('Direction Snapchat 👻', 200);
    finger.style.transition = 'none'; finger.style.left = '132px'; finger.style.top = '330px';
    await wait(30); finger.style.transition = ''; finger.classList.add('on');
    const ico = $('#snapIco'), sr = ico.getBoundingClientRect(), pr = $('#screen').getBoundingClientRect();
    const k = pr.width / $('#screen').offsetWidth;
    await move((sr.left + sr.width / 2 - pr.left) / k, (sr.top + sr.height / 2 - pr.top) / k);
    ico.classList.add('press'); await tap(); ico.classList.remove('press');
    $('#snap').classList.add('open'); await wait(900);

    // cliquer sur chachou❤️
    await say('Dans ses contacts : chachou❤️', 600);
    const row = $('#rowChachou'), rr = row.getBoundingClientRect();
    await move(110, (rr.top + rr.height / 2 - pr.top) / k, 900);
    row.classList.add('press'); await tap(); await wait(200);
    $('#chat').classList.add('open'); finger.classList.remove('on'); await wait(800);

    // écrire le message
    await say('Il lui écrit un petit message… ✍️', 0);
    const field = $('#field'); field.innerHTML = '';
    const typed = document.createElement('span'); const caret = document.createElement('span'); caret.className = 'caret';
    field.append(typed, caret);
    const chars = Array.from(MESSAGE);
    for (let i = 0; i < chars.length; i++) {
      typed.textContent += chars[i];
      if (i === 0) $('#sendBtn').classList.add('on');
      if (chars[i] !== ' ') sfx.key();
      const c = chars[i];
      await wait(/[,.!]/.test(c) ? 260 : c.codePointAt(0) > 0x2000 ? 140 : 42);
    }
    await wait(600);

    // envoyer
    const sb = $('#sendBtn'), br = sb.getBoundingClientRect();
    finger.style.transition = 'none'; finger.style.left = '200px'; finger.style.top = '420px';
    await wait(30); finger.style.transition = ''; finger.classList.add('on');
    await move((br.left + br.width / 2 - pr.left) / k, (br.top + br.height / 2 - pr.top) / k, 700);
    sb.classList.add('press'); await tap();
    field.innerHTML = '<span class="ph">Envoyer un chat</span>'; sb.classList.remove('on', 'press');
    $('#msgText').textContent = MESSAGE; $('#msg').classList.add('on'); sfx.pop();
    finger.classList.remove('on');
    await wait(700); $('#sent').classList.add('on');
    await say('Envoyé ! ❤️', 3200);

    // ---- 5. Retour chez Charline ----
    show('s-charline');
    await say('Pendant ce temps, à 7 km…', 1800);
    $('#c-phonescr').setAttribute('fill', '#9fd0ff');
    $('#notif').classList.add('on'); sfx.chime();
    hearts($);
    await say('Un message plein d\'amour attend Charline à son réveil 💌', 4200);
    hearts($);
    await wait(1500);
    cap.classList.remove('on');
    $('#end').classList.remove('hide');
    $('#again').onclick = () => { build(); stage.querySelector('#start').classList.add('hide'); play(s => stage.querySelector(s)); };
  }

  function hearts($) {
    const scene = $('#s-charline');
    const list = ['❤️', '💖', '😘', '💕', '❤️', '💗'];
    for (let i = 0; i < 14; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'flyheart';
        h.textContent = list[i % list.length];
        h.style.left = (380 + Math.random() * 260) + 'px';
        h.style.top = (330 + Math.random() * 60) + 'px';
        scene.appendChild(h);
        setTimeout(() => h.remove(), 4200);
      }, i * 220);
    }
  }

  build();
})();
</script>
