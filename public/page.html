<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a1a">
  <title>The Paradise — Page</title>
  <link rel="icon" href="/favicon.png?v=3" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js"></script>
</head>
<body>
<div class="landing">
  <header class="topnav">
    <a href="/" class="logo"><img src="/img/logo-mark.webp?v=3" alt=""><span class="word">The <span>Paradise</span></span></a>
    <nav>
      <a class="btn btn-ghost btn-sm nav-link" id="navHistoire" href="/histoire">📖 <span>Histoire</span></a>
      <a class="btn btn-ghost btn-sm nav-link" id="navReglement" href="/reglement">📜 <span>Règlement</span></a>
      <a class="btn btn-primary btn-sm" href="/chat">💬 <span>Chat</span></a>
    </nav>
  </header>
  <main class="page-wrap">
    <article class="card page-content" id="content"><p class="empty">Chargement…</p></article>
    <p class="page-back"><a href="/">← Retour à l'accueil</a></p>
    <p class="page-back"><span class="signature">💻 Site créé par <b>Anthony</b> · Développeur JS</span></p>
  </main>
</div>
<script>
  const isRules = location.pathname.startsWith('/reglement');
  document.getElementById(isRules ? 'navReglement' : 'navHistoire').classList.add('active');
  document.title = `The Paradise — ${isRules ? 'Règlement' : 'Notre histoire'}`;
  document.addEventListener('site', e => {
    const text = e.detail[isRules ? 'rulesContent' : 'historyContent'];
    document.getElementById('content').replaceChildren(text ? LC.richText(text) : LC.el('p', { class: 'empty' }, 'Cette page est vide pour le moment.'));
    document.title = `${e.detail.siteName} — ${isRules ? 'Règlement' : 'Notre histoire'}`;
  });
</script>
</body>
</html>
